<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>後台管理系統 - 登入</title>
    <style>
        /* ==================== 全局與基礎樣式 ==================== */
        * { 
            box-sizing: border-box; 
            font-family: "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }
        
        body {
            margin: 0;
            padding: 0;
            background-color: #bcdcb4;
            min-height: 100vh;
            position: relative;
            transition: background-color 0.3s ease;
        }

        /* ==================== 全螢幕背景與裝飾 (與 index 一致) ==================== */
        body.login-mode {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f8fcf7;
            position: relative;
            overflow: hidden;
        }

        /* 左上角與右下角的流線波浪背景裝飾 */
        body.login-mode::before,
        body.login-mode::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(10px);
            z-index: 0;
        }

        body.login-mode::before {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(188, 235, 190, 0.8) 0%, rgba(215, 245, 217, 0.4) 60%, rgba(255, 255, 255, 0) 100%);
            top: -200px;
            left: -200px;
        }

        body.login-mode::after {
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(188, 235, 190, 0.8) 0%, rgba(215, 245, 217, 0.4) 60%, rgba(255, 255, 255, 0) 100%);
            bottom: -250px;
            right: -250px;
        }

        /* ==================== 登入卡片區塊 ==================== */
        .login-card {
            background-color: #ffffff; 
            border-radius: 16px;       
            width: 580px;
            min-height: 480px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.05);
            padding: 50px 40px;
            position: relative;
            z-index: 5;
            border: 1px solid rgba(220, 235, 218, 0.5);
        }

        .login-logo {
            width: 80px;
            height: auto;
            margin-bottom: 16px;
        }

        .title {
            font-size: 30px;
            color: #2b4c23; 
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-bottom: 8px; 
            text-align: center;
        }

        .subtitle {
            font-size: 14px;
            color: #7ba370;
            font-weight: 600;
            letter-spacing: 3px;
            margin-bottom: 30px;
            text-transform: uppercase;
            text-align: center;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 16px;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
            justify-content: center;
        }

        .input-group input {
            background: #f7faf6;
            border: 1px solid #d0e3ce; 
            border-radius: 10px;
            font-size: 16px;
            width: 320px;
            text-align: center;
            outline: none;
            padding: 14px 20px;
            color: #2b4c23;
            transition: all 0.25s ease;
        }

        .input-group input:focus {
            border-color: #4e803c;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(78, 128, 60, 0.15);
        }

        .input-group input.input-error {
            border-color: #a01010 !important;
            box-shadow: 0 0 0 3px rgba(160, 16, 16, 0.15) !important;
        }

        .input-group input::placeholder {
            color: #a3baa0;
            font-weight: normal;
        }

        .toggle-password {
            position: absolute;
            right: auto;
            transform: translateX(130px);
            cursor: pointer;
            font-size: 18px;
            user-select: none;
            z-index: 10;
        }

        .login-btn {
            background-color: #4e803c; 
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            width: 320px;
            padding: 13px 0;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(78, 128, 60, 0.2);
            transition: all 0.2s ease;
            font-weight: 600;
            margin-top: 10px;
        }

        .login-btn:hover:not(:disabled) { 
            background-color: #3f6b30; 
            transform: translateY(-1px);
        }
        .login-btn:active:not(:disabled) { transform: scale(0.98); }
        .login-btn:disabled { background-color: #cccccc; cursor: not-allowed; }
        
        .login-admin-link {
            background-color: #f0f0f0;  
            color: #0f805a;             
            font-size: 15px;
            font-weight: 600;
            margin-top: 15px;
            padding: 12px 20px;         
            border: none;
            border-radius: 12px;        
            width: 320px;               
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            text-align: center;
        }

        .login-admin-link:hover {
            background-color: #e4e4e4;  
            color: #0a5c41;
        }

        /* 登入頁底部版權宣告 */
        .login-footer-copy {
            position: absolute;
            bottom: 25px;
            width: 100%;
            text-align: center;
            font-size: 13.5px;
            color: #668062;
            z-index: 10;
        }

        /* 📱 手機版 RWD 適應 */
        @media (max-width: 480px) {
            .login-card { width: 90%; min-height: auto; padding: 40px 20px; border-radius: 16px; }
            .title { font-size: 26px; margin-bottom: 2px; }
            .subtitle { font-size: 12px; margin-bottom: 25px; letter-spacing: 2px; }
            .input-group input { width: 100%; max-width: 280px; font-size: 16px; }
            .toggle-password { transform: translateX(110px); }
            .login-btn, .login-admin-link { width: 100%; max-width: 280px; }
        }
    </style>
</head>
<body class="login-mode">

    <!-- 後台登入卡片 -->
    <div id="login-section" class="login-card">
        <img src="logo.gif" alt="系統Logo" class="login-logo">
        
        <div class="title">後台管理系統</div>
        <div class="subtitle">MANAGEMENT SYSTEM LOGIN</div>
        
        <form class="login-form" id="loginForm" onsubmit="executeAdminLogin(event)">
            <div class="input-group">
                <input type="text" id="adminUser" placeholder="請輸入管理員帳號" autocomplete="username" autofocus required onclick="this.select()">
            </div>
            <div class="input-group">
                <input type="password" id="adminPass" placeholder="請輸入管理員密碼" autocomplete="current-password" required onclick="this.select()">
                <span class="toggle-password" id="eye-icon" onclick="togglePasswordVisibility()">🔐</span>
            </div>
            <button type="submit" class="login-btn" id="submit-login-btn">登入系統</button>
            <button type="button" class="login-admin-link" onclick="navigateToHome()">返回點餐系統</button>
        </form>
    </div>

    <!-- 頁尾宣告 -->
    <div class="login-footer-copy">
        © 秀傳醫療財團法人彰濱秀傳紀念醫院 版權所有
    </div>

    <script>
        let isSubmitting = false;

        function navigateToHome() {
            window.location.href = 'index.html'; 
        }

        function togglePasswordVisibility() {
            const passInput = document.getElementById('adminPass');
            const eyeIcon = document.getElementById('eye-icon');
            
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.textContent = '🔒';
            } else {
                passInput.type = 'password';
                eyeIcon.textContent = '🔐';
            }
        }

        const ADMIN_NAMES = {
            '18445': '李珈豪',
            '11110': '林佳蘭'
        };

        async function executeAdminLogin(event) {
            if (event) event.preventDefault();
            if (isSubmitting) return;

            const userInput = document.getElementById('adminUser');
            const passInput = document.getElementById('adminPass');
            const loginBtn = document.getElementById('submit-login-btn');

            userInput.classList.remove('input-error');
            passInput.classList.remove('input-error');

            const username = userInput.value.trim();
            const password = passInput.value;

            if (!username || !password) {
                if(!username) userInput.classList.add('input-error');
                if(!password) passInput.classList.add('input-error');
                
                loginBtn.innerText = '請完整輸入帳密';
                setTimeout(() => {
                    loginBtn.innerText = '登入系統';
                }, 2000);
                return;
            }

            isSubmitting = true;
            loginBtn.disabled = true;
            userInput.disabled = true;
            passInput.disabled = true;
            loginBtn.innerText = '認證中...';

            function showLoginError(msg) {
                userInput.classList.add('input-error');
                passInput.classList.add('input-error');
                
                loginBtn.innerText = msg;
                
                setTimeout(() => {
                    isSubmitting = false;
                    loginBtn.disabled = false;
                    userInput.disabled = false;
                    passInput.disabled = false;
                    loginBtn.innerText = '登入系統';
                    
                    passInput.value = '';
                    passInput.type = 'password';
                    document.getElementById('eye-icon').textContent = '🔐';
                    passInput.focus();
                }, 2000);
            }

            setTimeout(async () => {
                const validAdmins = {
                    '18445': ['zxc456456'],
                    '11110': ['12345678']
                };

                if (validAdmins[username] && validAdmins[username].includes(password)) {
                    const adminName = ADMIN_NAMES[username] || '管理員';
                    localStorage.setItem('currentAdminName', adminName);

                    loginBtn.innerText = '認證成功';
                    setTimeout(() => {
                        window.location.href = 'admin-dashboard.html';
                    }, 600);
                    return; 
                } 
                
                try {
                    const response = await fetch('/api/admin/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });

                    const data = await response.json();

                    if (response.ok && data.success) {
                        const adminName = data.name || ADMIN_NAMES[username] || '管理員';
                        localStorage.setItem('currentAdminName', adminName);

                        loginBtn.innerText = '認證成功';
                        setTimeout(() => {
                            window.location.href = 'admin-dashboard.html';
                        }, 600);
                        return; 
                    } else {
                        showLoginError(data.message || '帳號或密碼錯誤');
                        return;
                    }
                } catch (error) {
                    showLoginError('帳號或密碼錯誤');
                    return;
                }

            }, 600);
        }
    </script>
</body>
</html>
